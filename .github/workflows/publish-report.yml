name: Publicar reporte tecnico PDF final

on:
  push:
    paths:
      - '.github/workflows/publish-report.yml'
      - 'fuentes/generar_reporte.py'
      - 'docs/uci_source_manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf-final:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependencias PDF
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pymupdf
      - name: Construir PDF definitivo con capturas obligatorias
        run: python -m fuentes.generar_reporte --require-screenshots
      - name: Validar estructura y renderizado del PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          p=Path("docs/Reporte_Tecnico_Actividad5.pdf")
          assert p.is_file() and p.stat().st_size > 80000, "PDF ausente o muy pequeño"
          d=fitz.open(p)
          total_imgs=sum(len(page.get_images(full=True)) for page in d)
          content=" ".join(page.get_text() for page in d)
          assert len(d)>=8, f"Reporte demasiado breve: {len(d)} páginas"
          assert total_imgs>=14, f"Faltan evidencias o figuras: {total_imgs} imágenes"
          for label in ["RandomForest","LogisticRegression",
                        "MLflow","Bootstrap","Declaración de uso"]:
              assert label.lower() in content.lower(), f"Falta sección: {label}"
          print("PDF:", p.stat().st_size, "bytes /",len(d),"páginas /",total_imgs,"imágenes")
          preview=Path("docs")/"vista_previa_pdf"
          preview.mkdir(exist_ok=True)
          for i in sorted(set([0,1,len(d)//2,len(d)-1])):
              page=d[i]
              pix=page.get_pixmap(matrix=fitz.Matrix(1.2,1.2),alpha=False)
              pix.save(str(preview/f"pagina_{i+1:02d}.png"))
          d.close()
          PY
      - name: Subir PDF final como evidencia CI
        uses: actions/upload-artifact@v4
        with:
          name: reporte-final-actividad5
          path: |
            docs/Reporte_Tecnico_Actividad5.pdf
            docs/vista_previa_pdf/*.png
      - name: Publicar PDF directamente en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Reporte_Tecnico_Actividad5.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: agregar reporte tecnico PDF final con evidencias MLflow"
            git push origin HEAD:main
          else
            echo "El PDF ya coincide con el publicado"
          fi
